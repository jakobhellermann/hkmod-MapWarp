name: Build

on:
  push:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-new-version: ${{ steps.tag.outputs.exists == 'false' }}

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    - name: Build
      run: dotnet build -c Release --verbosity normal
      env:
        NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}

    - name: Get version
      id: version
      run: echo "version=$(dotnet build MapWarp.csproj -getProperty:Version)" >> $GITHUB_OUTPUT

    - name: Package one zip per game version
      run: |-
        mkdir -p dist
        for dir in bin/Release/*/; do
          zip -j "dist/MapWarp-$(basename "$dir").zip" "$dir/MapWarp.dll" "$dir/MapWarp.pdb"
        done
        ls -l dist

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: MapWarp-${{ steps.version.outputs.version }}
        path: dist/*.zip

    - name: Check whether the version is already released
      id: tag
      uses: mukunku/tag-exists-action@v1.7.0
      with:
        tag: v${{ steps.version.outputs.version }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build.outputs.is-new-version == 'true'

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        name: MapWarp-${{ needs.build.outputs.version }}
        path: dist
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        draft: false
        generate_release_notes: true
        fail_on_unmatched_files: true
        tag_name: v${{ needs.build.outputs.version }}
        files: dist/*.zip
